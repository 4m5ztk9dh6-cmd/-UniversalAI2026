
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '**.swift'
      - '**.plist'
      - '**.storyboard'
      - '**.yml'
      - '**.yaml'
      - '**.zip'
      - 'project.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found in repository root"
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project configuration
        run: |
          PROJECT_YML=$(find extracted -name project.yml -print -quit)
          if [ -z "$PROJECT_YML" ]; then
            echo "ERROR: project.yml not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_YML")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Build iOS app
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -project *.xcodeproj \
            -scheme UniversalAIAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find "$PROJECT_DIR/build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App build product not found"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r UniversalAIAssistant.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalAIAssistant-IPA
          path: UniversalAIAssistant.ipa
          if-no-files-found: error
