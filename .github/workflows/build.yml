name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract source ZIP
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | grep -v 'iOS源码' | head -n 1)
          echo "找到压缩包：$ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source
          cp -R source/. .

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project UniversalAIAssistant.xcodeproj \
            -scheme UniversalAIAssistant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r UniversalAIAssistant-IPA.zip Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UniversalAIAssistant-IPA
          path: UniversalAIAssistant-IPA.zip
